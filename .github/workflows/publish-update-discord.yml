name: Post update JSON to Discord

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post to Discord even if version did not change"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  post-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read JSON and post Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          FORCE_POST: ${{ inputs.force_post }}
        run: |
          node <<'NODE'
          (async () => {
            const fs = require("fs");
            const { execSync } = require("child_process");

            const jsonFile = "manifest.json";
            const postedStateFile = ".discord-last-posted-version";

            const webhookUrl = process.env.DISCORD_WEBHOOK_URL || "";
            const forcePost = process.env.FORCE_POST === "true";

            const lappedCarRoleId = "1514766461468414122";

            if (!fs.existsSync(jsonFile)) {
              throw new Error(`Missing JSON file: ${jsonFile}`);
            }

            const data = JSON.parse(fs.readFileSync(jsonFile, "utf8"));

            const version = String(data.version || "").trim();

            if (!version) {
              throw new Error(`Missing "version" in ${jsonFile}`);
            }

            const publishDiscord = data.publishDiscord !== false;

            const updateTitle = String(data.updateTitle || "Update").trim();

            const fullTitle = String(
              data.fullTitle ||
              `${version} - ${updateTitle}`
            ).trim();

            const discordUrl = String(
              data.discordUrl || data.releasePageUrl || data.packageUrl || ""
            ).trim();

            if (!discordUrl) {
              throw new Error(`Missing "discordUrl", "releasePageUrl", or "packageUrl" in ${jsonFile}`);
            }

            let lastPostedVersion = "";

            if (fs.existsSync(postedStateFile)) {
              lastPostedVersion = fs.readFileSync(postedStateFile, "utf8").trim();
            }

            const versionChanged = lastPostedVersion !== version;

            console.log(`JSON version: ${version}`);
            console.log(`Last Discord posted version: ${lastPostedVersion || "(none)"}`);
            console.log(`Version changed: ${versionChanged}`);
            console.log(`Force post: ${forcePost}`);
            console.log(`publishDiscord: ${publishDiscord}`);

            if (!publishDiscord) {
              console.log("publishDiscord is false. Skipping Discord post.");
              return;
            }

            if (!versionChanged && !forcePost) {
              console.log("Version already posted and force_post is false. Skipping Discord post.");
              return;
            }

            if (!webhookUrl) {
              throw new Error("DISCORD_UPDATES_WEBHOOK secret is missing.");
            }

            const hasRoleMention =
              lappedCarRoleId &&
              lappedCarRoleId !== "COLE_AQUI_O_ID_DO_CARGO_LAPPED_CAR";

            const fields = [
              {
                name: "Version",
                value: version,
                inline: true
              },
              {
                name: "Update title",
                value: updateTitle,
                inline: false
              },
              {
                name: "Download",
                value: discordUrl,
                inline: false
              }
            ];

            if (Array.isArray(data.changelog) && data.changelog.length > 0) {
              fields.push({
                name: "Changelog",
                value: data.changelog
                  .slice(0, 10)
                  .map(item => `• ${String(item)}`)
                  .join("\n")
                  .slice(0, 1024),
                inline: false
              });
            }

            const discordPayload = {
              username: "doX Updates",
              content: hasRoleMention ? `<@&${lappedCarRoleId}>` : "",
              allowed_mentions: hasRoleMention
                ? { roles: [lappedCarRoleId] }
                : { parse: [] },
              embeds: [
                {
                  title: fullTitle,
                  url: discordUrl,
                  description: "A new version of doX LMU Overlays Collection is available.",
                  fields,
                  footer: {
                    text: "doX LMU Overlays Collection"
                  }
                }
              ]
            };

            const discordResponse = await fetch(webhookUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(discordPayload)
            });

            if (!discordResponse.ok) {
              const body = await discordResponse.text();
              throw new Error(`Discord webhook failed: ${discordResponse.status} ${body}`);
            }

            console.log(`Discord post sent for version ${version}.`);

            fs.writeFileSync(postedStateFile, `${version}\n`, "utf8");

            execSync('git config user.name "doX Update Bot"');
            execSync('git config user.email "actions@github.com"');
            execSync(`git add ${postedStateFile}`);

            try {
              execSync('git commit -m "Update Discord posted version"');
              execSync("git push");
              console.log("Posted version state committed.");
            } catch {
              console.log("No posted version state change to commit.");
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
